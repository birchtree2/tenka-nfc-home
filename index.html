<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7fc">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{SHARE_IMAGE}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{URL}}">
  <title>{{TITLE}}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f1e6fa'/%3E%3Cpath d='M32 8Q32 32 56 32Q32 32 32 56Q32 32 8 32Q32 32 32 8Z' fill='%239463ba'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="{{ENTRY_IMAGE}}" fetchpriority="high">
  <!-- INLINE_STYLES -->
</head>
<body class="{{BODY_CLASS}}">
  <a class="skip-link" href="#profile">跳到个人介绍</a>
  <div class="atmosphere" aria-hidden="true"><div class="aurora aurora-a"></div><div class="aurora aurora-b"></div></div>
  <div class="entry" id="entry" role="dialog" aria-modal="true" aria-labelledby="entry-name" {{ENTRY_HIDDEN}}>
    <div class="entry-layout">
    <div class="entry-art"><img id="entry-character" src="{{ENTRY_IMAGE}}" alt="大崎甜花加载页立绘" fetchpriority="high"></div>
    <div class="entry-content">
      <div class="entry-unit"><img id="entry-avatar" src="{{ENTRY_AVATAR}}" alt="甜花 Q 版头像" width="64" height="64"><span><span class="entry-flower" aria-hidden="true">✿</span> ALSTROEMERIA</span></div>
      <h1 id="entry-name">TENKA</h1>
      <p id="entry-tagline" hidden>{{TAGLINE}}</p>
      <div class="load-track" role="progressbar" id="entry-progress" aria-label="自动进入进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="load-fill"></span></div>
      <p class="countdown" id="countdown">0%</p>
      <button class="entry-sound-toggle" id="entry-sound-toggle" type="button" aria-pressed="false"><span>声音</span><span class="sound-switch" aria-hidden="true"></span><span id="entry-sound-state">OFF</span></button>
    </div>
    </div>
  </div>
  <div id="site" {{SITE_INERT}}>
    <header class="topbar">
      <a class="brand" href="#profile" aria-label="回到主页"><span class="brand-symbol" aria-hidden="true">✦</span><span class="brand-label">ALSTROEMERIA</span></a>
      <div class="top-controls">
        <button id="sound-toggle" class="icon-button" type="button" aria-label="关闭入场语音" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 6 6m0-6-6 6"/></svg></button>
      </div>
    </header>
    <main>
      <section class="stage" id="profile" aria-labelledby="profile-name">
        <div class="stage-art" id="stage-art">
          <div class="art-panel" aria-hidden="true"></div>
          <div class="art-wordmark" aria-hidden="true">TENKA</div>
          <svg class="art-ribbon" aria-hidden="true" viewBox="0 0 520 680" fill="none">
            <path class="ribbon-main" d="M85 540C-30 365 78 80 283 65C486 50 563 344 421 554"/>
            <path class="ribbon-tail" d="M45 465C129 605 414 586 484 373"/>
            <circle cx="85" cy="540" r="5"/><circle cx="484" cy="373" r="4"/>
          </svg>
          <svg class="art-flower" aria-hidden="true" viewBox="0 0 100 100" fill="none">
            <g><path d="M50 48C11 28 33-12 50 10C67-12 89 28 50 48Z"/><path d="M50 48C11 28 33-12 50 10C67-12 89 28 50 48Z" transform="rotate(120 50 50)"/><path d="M50 48C11 28 33-12 50 10C67-12 89 28 50 48Z" transform="rotate(240 50 50)"/></g><circle cx="50" cy="50" r="5"/>
          </svg>
          <span class="art-glint glint-a" aria-hidden="true">✦</span><span class="art-glint glint-b" aria-hidden="true">✦</span>
          <div class="art-caption" aria-hidden="true"><span></span>ALSTROEMERIA<span></span></div>
          <img id="character" class="character" alt="" decoding="async">
        <div class="dialogue" id="dialogue" hidden>
          <div class="dialogue-top"><span><i aria-hidden="true"></i><b id="speaker"></b></span><button id="replay" type="button" aria-label="重播入场语音和台词">播放语音</button></div>
          <p class="japanese" id="japanese" lang="ja" aria-hidden="true"></p><p class="sr-only" id="spoken-line"></p>
          <p class="translation" id="translation"></p><span class="dialogue-next" aria-hidden="true">◆</span>
        </div>

        </div>
        <div class="identity">
          <div class="identity-heading"><h1 id="profile-name">{{NAME}}</h1><span class="identity-divider" aria-hidden="true">/</span><span id="role"></span></div>
          <p class="tagline" id="tagline" hidden>{{TAGLINE}}</p>
          <nav class="contacts" id="contacts" aria-label="联系方式"></nav>
          <a class="about-link" href="#about" id="about-link">关于我 <span aria-hidden="true">↓</span></a>
        </div>
      </section>
      <section class="music-section" id="music-widget" aria-label="音乐" hidden>
        <div class="music-heading"><img class="music-cover" id="music-cover" alt="歌曲封面" width="64" height="64"><div><h2 id="song-title"></h2><p id="song-artist"></p></div></div>
        <div class="music-embed"><iframe id="music-player" title="音乐播放器" width="100%" height="86" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
        <p class="music-help">播放器空白时，可重新加载或在网易云打开。</p>
        <div class="music-links"><a id="song-link" target="_blank" rel="noopener noreferrer">在网易云打开 ↗</a><button id="music-retry" type="button">重新加载</button></div>
      </section>
      <section class="about-section" id="about" aria-label="详细介绍">
        <details class="about-details" id="about-details">
          <summary><span class="about-title">关于我</span><span class="expand-icon" aria-hidden="true">+</span></summary>
          <div class="about-body"><div class="about-copy"><h2 id="about-name"></h2><div id="about-paragraphs"></div></div><figure><img id="about-portrait" alt="" loading="lazy" decoding="async"></figure></div>
        </details>
      </section>
    </main>
    <footer><span id="footer-text"></span><a id="credits" target="_blank" rel="noopener noreferrer"></a><button id="reenter" type="button">重看入场 ↗</button></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="copy-dialog"><form method="dialog"><h2 id="copy-title">复制内容</h2><input id="copy-value" readonly aria-label="待复制内容"><p>长按或选中后复制</p><button>关闭</button></form></dialog>
  <noscript><div class="noscript">请开启 JavaScript 以查看主页和联系方式。</div></noscript>
  <!-- INLINE_SCRIPT -->
</body>
</html>

# Nginx Proxy Manager: Advanced configuration for card.umi-cv.com.
# Static files are served directly from the existing /data bind mount.
root /data/static/card/current;
index index.html;
etag on;
sendfile on;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_static on;

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=600";
}
location ~ /\. {
    deny all;
}
